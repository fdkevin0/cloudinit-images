name: Build cloud image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build Debian 13 cloud image
        run: |
          # Keep passt PID files under /tmp, allowed by Ubuntu's AppArmor profile.
          env -u XDG_RUNTIME_DIR LIBGUESTFS_BACKEND=direct bash -e scripts/build_debian-13.sh
          qemu-img check -f qcow2 debian-13-genericcloud-amd64-fdkevin-cn.qcow2
      - name: Upload cloud image
        uses: actions/upload-artifact@v7
        with:
          name: debian-13-genericcloud-amd64-fdkevin-cn
          path: debian-13-genericcloud-amd64-fdkevin-cn.qcow2
          compression-level: 0
          if-no-files-found: error
